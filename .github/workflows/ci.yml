name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-self-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Pytest suite
        run: |
          pytest tests/ -v
      - name: Self-scan Gate (AgentSentry static scan)
        run: |
          python -m agentsentry.cli scan --path . --format json > self_scan.json
          python -c "
          import json, sys
          data = json.load(open('self_scan.json'))
          criticals = [f for f in data['findings'] if f['severity'] == 'CRITICAL']
          if criticals:
              print('SELF SCAN FAILED:', criticals)
              sys.exit(1)
          print('Self scan passed successfully with 0 critical findings.')
          "
